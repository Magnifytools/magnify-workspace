name: Flight price tracker

on:
  schedule:
    # Cada 6 horas (UTC).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No enviar email (solo registrar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flight-tracker
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  track:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/flight-price-tracker-LC8Db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          FT_SMTP_HOST: ${{ secrets.FT_SMTP_HOST }}
          FT_SMTP_PORT: ${{ secrets.FT_SMTP_PORT }}
          FT_SMTP_USERNAME: ${{ secrets.FT_SMTP_USERNAME }}
          FT_SMTP_PASSWORD: ${{ secrets.FT_SMTP_PASSWORD }}
          FT_SMTP_FROM: ${{ secrets.FT_SMTP_FROM }}
          FT_SMTP_TO: ${{ secrets.FT_SMTP_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main --config config.actions.toml --dry-run -v
          else
            python -m src.main --config config.actions.toml -v
          fi

      - name: Commit DB if changed
        run: |
          if [ -f data/prices.db ]; then
            git config user.name  "flight-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -f data/prices.db
            [ -f report.md ] && git add -f report.md
            if ! git diff --staged --quiet; then
              git commit -m "chore(flight-tracker): update price history [skip ci]"
              git push origin HEAD:claude/flight-price-tracker-LC8Db
            else
              echo "Sin cambios en DB."
            fi
          fi
