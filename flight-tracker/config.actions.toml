# Config usado por GitHub Actions. NO contiene secretos.
# Email se rellena en runtime via secretos del repo (FT_SMTP_*).
#
# Vuelta del evento de Shenzhen a Barcelona.
# 3 aeropuertos x 4 dias (vie 18 - lun 21 sep 2026) = 12 watches.
# Alerta si: precio <= 600 USD (target absoluto) o si baja >=5% vs minimo historico.

