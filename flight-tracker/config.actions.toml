# Config usado por GitHub Actions. NO contiene secretos.
# Email se rellena en runtime via secretos del repo (FT_SMTP_*).
#
# Evento Antalya 1-4 octubre 2026. Pareja llega IST 29 sep.
# Combinaciones a comparar:
#   A) David BCN->IST 29, juntos IST->AYT 1-oct.
#   B) David BCN->AYT 1-oct directo, pareja IST->AYT 1-oct.
#   C) Ambos a Antalya el 29 (David BCN->AYT, pareja IST->AYT).
# Vuelta: AYT->BCN el 4 o 5 oct.

# --- Ida ---

[[watches]]
name = "BCN-IST 2026-09-29"
origin = "BCN"
destination = "IST"
date = "2026-09-29"
non_stop = true
seat_class = "ECONOMY"
adults = 1
drop_pct = 5
target_price = 120

